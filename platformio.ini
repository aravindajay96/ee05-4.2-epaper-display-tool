[platformio]
default_envs = ee05_4in2

[env:ee05_4in2]
; Keep the board target used by the previously working EE05 project.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-plus
framework = arduino

upload_speed = 115200
monitor_speed = 115200

; XIAO ESP32S3 Plus / EE05 memory configuration.
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -I src

; Use Seeed_GFX legacy API (TFT_eSPI.h + EPaper).
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
